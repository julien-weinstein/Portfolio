<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPY 0DTE Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>SPY <span class="header-badge">0DTE</span></h1>
        </div>
        <div class="header-right">
            <div class="market-status" id="marketStatus">
                <span class="status-dot"></span>
                <span class="status-text">...</span>
            </div>
            <span class="last-update" id="lastUpdate"></span>
        </div>
    </header>

    <main>
        <div class="price-bar">
            <div class="price-main">
                <span class="price-value" id="spyPrice">--</span>
                <span class="price-change" id="spyChange"></span>
            </div>
            <div class="price-stats-row">
                <div class="price-stat">
                    <span class="stat-label">VIX</span>
                    <span class="stat-value" id="vixValue">--</span>
                </div>
                <div class="price-stat">
                    <span class="stat-label">IV</span>
                    <span class="stat-value" id="ivValue">--</span>
                </div>
                <div class="price-stat">
                    <span class="stat-label">RANGE</span>
                    <span class="stat-value" id="rangeValue">--</span>
                </div>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="priceChart"></canvas>
        </div>

        <div class="rec-card" id="recCard">
            <div class="rec-signal" id="recSignal">ANALYZING...</div>
            <div class="rec-details" id="recDetails"></div>
        </div>

        <div class="timing-bar" id="timingBar"></div>

        <details class="factors-panel">
            <summary>Model Factors</summary>
            <div id="factorList"></div>
        </details>
    </main>

    <footer>
        <strong>Not financial advice.</strong> 0DTE options carry extreme risk. For educational purposes only.
    </footer>

    <script src="data-engine.js"></script>
    <script src="technical-analysis.js"></script>
    <script src="prediction-engine.js"></script>
    <script src="options-strategy.js"></script>
    <script src="app.js"></script>
</body>
</html>
