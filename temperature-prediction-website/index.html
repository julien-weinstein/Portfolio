<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Temperature Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>US Temperature Forecast</h1>
        <p class="subtitle">24-hour hourly predictions for major cities</p>
        <div class="unit-toggle">
            <button id="btn-f" class="unit-btn active">&deg;F</button>
            <button id="btn-c" class="unit-btn">&deg;C</button>
        </div>
    </header>

    <section class="map-section">
        <svg id="us-map" viewBox="0 0 960 620" preserveAspectRatio="xMidYMid meet">
            <defs>
                <radialGradient id="glow-pulse" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
                </radialGradient>
                <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
                </filter>
            </defs>
            <g id="state-paths"></g>
            <g id="city-markers"></g>
        </svg>
    </section>

    <section id="city-cards" class="city-cards"></section>

    <section id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
            <div>
                <h2 id="detail-city-name"></h2>
                <p id="detail-city-label" class="detail-label"></p>
            </div>
            <div id="detail-current" class="detail-current"></div>
        </div>
        <div class="hourly-scroll-wrapper">
            <div id="hourly-cards" class="hourly-cards"></div>
        </div>
        <div class="chart-wrapper">
            <canvas id="hourly-chart"></canvas>
        </div>
    </section>

    <footer>
        <p>Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo API</a> &mdash; Forecasts are estimates and may differ from actual conditions.</p>
    </footer>

    <script src="us-states-paths.js"></script>
    <script src="cities-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
